<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <header>
      <img src="../../icons/icon-128.png" alt="" width="40" height="40" />
      <div class="heading">
        <h1><span id="settings-title"></span> <span id="version"></span></h1>
        <div class="account">
          <span id="login-status"></span>
          <button id="sign-out" class="link" type="button" hidden>Sign out</button>
          <button id="help" class="link" type="button">Help</button>
        </div>
      </div>
      <button id="close-settings" type="button" aria-label="Close">✕</button>
    </header>
    <main>
      <div class="section-heading">
        <h2>Layers</h2>
        <button id="reset-settings" class="link" title="Restore extension default layers">
          ↺ Reset to Defaults
        </button>
      </div>
      <ul id="layer-list"></ul>
      <button id="add-layer" disabled>+ Add Layer</button>
      <button id="apply-settings" disabled>Apply changes</button>
    </main>
    <script src="../../lib/browser-polyfill.min.js"></script>
    <script src="./settings.js" type="module"></script>
  </body>
</html>
