<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title"></title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="container">
      <img src="../../icons/icon-128.png" alt="Strava Heatmap" class="icon" />
      <h1 id="page-heading"></h1>
      <div class="message" id="message"></div>
      <div class="actions">
        <div class="actions-column">
          <a href="#changelog" target="_blank" class="action-btn">
            <span>📖</span>
            <span>What's new?</span>
          </a>
          <a href="#readme" target="_blank" class="action-btn">
            <span>📚</span>
            <span>Help & Instructions</span>
          </a>
          <a
            href="https://www.openstreetmap.org/edit?editor=id"
            target="_blank"
            class="action-btn primary"
          >
            <img src="./openstreetmap.png" alt="" width="24" height="24" />
            <span>Try with OpenStreetMap</span>
          </a>
          <a href="https://gpx.studio/app" target="_blank" class="action-btn primary">
            <img src="./gpx-studio.png" alt="" width="24" height="24" />
            <span>Try with GPX Studio</span>
          </a>
        </div>
        <div class="actions-column">
          <a
            href="https://github.com/julcnx/strava-heatmap-extension/issues"
            target="_blank"
            class="action-btn"
          >
            <span>🐞</span>
            <span>Submit a bug or improvement</span>
          </a>
          <a
            href="https://community.openstreetmap.org/t/new-strava-heatmap-extension-for-id/100544"
            target="_blank"
            class="action-btn"
          >
            <span>💬</span>
            <span>Discuss</span>
          </a>
          <a href="#rate" target="_blank" class="action-btn">
            <span>⭐</span>
            <span>Rate this extension</span>
          </a>
          <a href="https://ko-fi.com/julcnx" target="_blank" class="action-btn">
            <span>❤️</span>
            <span>Support this extension</span>
          </a>
        </div>
      </div>
    </div>
    <script src="../../lib/browser-polyfill.min.js"></script>
    <script type="module" src="./index.js"></script>
  </body>
</html>
