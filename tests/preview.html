<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strava Slide — saved tile preview</title>
  <style>
    body {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
      font: 16px system-ui;
    }
    button,
    select {
      padding: 8px 12px;
      margin: 0 8px 12px 0;
    }
    button img {
      height: 16px;
      vertical-align: middle;
      margin-right: 6px;
    }
    canvas {
      width: 100%;
      background: #290020;
    }
    .input {
      color: #2683ff;
    }
    .reference {
      color: #d000bc;
    }
    .output {
      color: #008457;
    }
    .reported {
      color: #e04040;
    }
  </style>
  <h1>Strava Slide — offline preview</h1>
  <p>
    Uses only the supplied tiles and OSC files. No Strava account or external service
    required.
  </p>
  <label
    >Example
    <select id="example">
      <option value="curves">Original tight curves</option>
      <option value="straight">New straight passages</option>
    </select></label
  >
  <label
    >Tiles
    <select id="tiles">
      <option value="mixed">Zoom 15 + 14 fallback</option>
      <option value="parent">Zoom 14 only</option>
    </select></label
  >
  <button id="run" disabled><img src="../icons/slide.svg" alt="" />Slide</button>
  <button id="export" disabled>Download output OSC</button>
  <p>
    <label class="input"><input id="input" type="checkbox" checked /> Input</label>
    <label class="reference"
      ><input id="reference" type="checkbox" checked /> Reference</label
    >
    <label class="output"
      ><input id="output" type="checkbox" checked /> Slide result</label
    >
    <label class="reported"
      ><input id="reported" type="checkbox" /> Previous output</label
    >
  </p>
  <p id="status" role="status">Loading fixtures…</p>
  <canvas id="map"></canvas>
  <script type="module" src="./preview.js"></script>
</html>
